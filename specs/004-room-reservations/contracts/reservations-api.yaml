openapi: 3.0.3
info:
  title: Raumlotse Room Reservations API
  version: 1.0.0
  description: REST API for creating, viewing, updating, and cancelling room reservations in Raumlotse.
paths:
  /api/rooms/{roomId}/reservations:
    post:
      summary: Create a room reservation
      description: Creates a new reservation for the specified room after conflict detection and capacity validation.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Invalid input or capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Room, floor, or seating arrangement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Scheduling conflict with existing reservation or room is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      summary: List reservations for a room
      description: Retrieves all scheduled and historical reservations for a specific room.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Optional lower bound filter (ISO 8601 UTC)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Optional upper bound filter (ISO 8601 UTC)
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/rooms/{roomId}/available-equipment:
    get:
      summary: List additional equipment available for a room
      description: Returns active catalog equipment types that are not permanently installed in the specified room.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of additional equipment types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentTypeResponse'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/reservations/{reservationId}:
    get:
      summary: Get reservation details
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

    patch:
      summary: Update reservation metadata
      description: Updates expected attendees and/or note on an existing reservation in RESERVED status.
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
      responses:
        '200':
          description: Reservation metadata updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Attendees exceed seating capacity or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Reservation is not in RESERVED status (ACTIVE, EXPIRED, CANCELLED cannot be edited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/reservations/{reservationId}/cancel:
    post:
      summary: Cancel a reservation
      description: Cancels an upcoming or active reservation, releasing the room immediately.
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Reservation is already CANCELLED or EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    ReservationCreateRequest:
      type: object
      required:
        - startTime
        - endTime
        - seatingArrangementId
        - expectedAttendees
        - createdBy
      properties:
        startTime:
          type: string
          format: date-time
          description: Reservation start time in ISO 8601 UTC
          example: '2026-10-01T09:00:00Z'
        endTime:
          type: string
          format: date-time
          description: Reservation end time in ISO 8601 UTC
          example: '2026-10-01T11:00:00Z'
        seatingArrangementId:
          type: string
          format: uuid
          description: UUID of the room's seating arrangement
        expectedAttendees:
          type: integer
          minimum: 1
          description: Headcount expected
          example: 25
        additionalEquipmentTypeIds:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of additional equipment types requested
          default: []
        note:
          type: string
          maxLength: 2000
          description: Optional longtext remarks or setup notes
          example: 'Please prepare 2 microphones and verify HDMI cabling.'
        createdBy:
          type: string
          minLength: 1
          maxLength: 255
          description: Name or institutional ID of reserving user
          example: 'Prof. Dr. Jane Doe'

    ReservationUpdateRequest:
      type: object
      properties:
        expectedAttendees:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 2000

    ReservationResponse:
      type: object
      required:
        - id
        - roomId
        - roomName
        - startTime
        - endTime
        - status
        - seatingArrangement
        - expectedAttendees
        - additionalEquipment
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        roomName:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [RESERVED, ACTIVE, EXPIRED, CANCELLED]
        seatingArrangement:
          $ref: '#/components/schemas/SeatingArrangementSummary'
        expectedAttendees:
          type: integer
        additionalEquipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentTypeResponse'
        note:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    SeatingArrangementSummary:
      type: object
      required:
        - id
        - name
        - maxCapacity
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        maxCapacity:
          type: integer

    EquipmentTypeResponse:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DEACTIVATED]

    Problem:
      type: object
      required:
        - title
        - status
        - detail
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
