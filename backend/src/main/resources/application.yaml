spring:
  application:
    name: raumlotse
  web:
    # Meldungen der Bean Validation (z. B. "darf nicht null sein") erscheinen auf Deutsch.
    locale: de
    locale-resolver: fixed
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/raumlotse}
    username: ${SPRING_DATASOURCE_USERNAME:raumlotse}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      # Map images (feature 012) are limited to 10 MB.
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    properties:
      hibernate:
        # Loads seating arrangements and equipment for up to 100 rooms per query instead of one query per
        # room (room search, feature 008; guarded by RoomSearchPerformanceIntegrationTest).
        default_batch_fetch_size: 100
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
booking-confirmation:
  sender: ${MAIL_FROM:noreply@raumlotse.local}
  zone: Europe/Berlin
  poll-delay: ${MAIL_POLL_DELAY:1s}
  batch-size: ${MAIL_BATCH_SIZE:20}
  stale-threshold: ${MAIL_STALE_THRESHOLD:30s}
  connection-timeout: ${MAIL_CONNECTION_TIMEOUT:5s}
  read-timeout: ${MAIL_READ_TIMEOUT:5s}
  write-timeout: ${MAIL_WRITE_TIMEOUT:5s}
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
