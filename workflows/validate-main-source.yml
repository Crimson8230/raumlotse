name: Validate main PR source

on:
  pull_request:
    branches:
      - main

jobs:
  validate-source:
    name: Only dev can merge into main
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        if: github.head_ref != 'dev'
        run: |
          echo "Pull requests to main must originate from dev."
          exit 1